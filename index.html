<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHUZA AUCTION - 5 LEVELS</title>
<style>
body{font-family:Arial;background:#111;color:#fff;margin:0;padding:10px}
.card{background:#222;padding:12px;border-radius:10px;margin:10px 0}
button{background:#ffcc00;color:#000;padding:10px 15px;border:0;border-radius:8px;font-weight:bold}
input{padding:10px;border-radius:8px;border:0;width:90%;margin:5px 0}
.badge{background:#ffcc00;color:#000;padding:2px 6px;border-radius:6px;font-size:12px}
</style>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script>
</head>
<body>
<h2>🔥 PHUZA AUCTION - R5/R9/R13/R15/R20 Levels</h2>
<div id="status" class="card">Loading...</div>
<div class="card">
<h3>Register / Login</h3>
<input id="email" placeholder="Email: bigsamentertainmentrsa@gmail.com">
<input id="password" type="password" placeholder="Password: Crazy12345">
<input id="display_name" placeholder="Display Name">
<input id="ref_code_input" placeholder="Ref Code (optional)">
<br>
<button onclick="register()">Register</button>
<button onclick="login()">Login</button>
<button onclick="logout()">Logout</button>
</div>
<div class="card">
<h3>Wallet: R<span id="balance">0</span></h3>
<div>Your Code: <b id="mycode">---</b> | Level: <span id="mylevel">1</span> | Refs: <span id="myrefs">0</span></div>
</div>
<div class="card">
<h3>Deposit Voucher (Min R50)</h3>
<input id="voucher_amount" type="number" placeholder="50">
<input id="voucher_pin" placeholder="Voucher PIN">
<button onclick="depositVoucher()">Deposit Voucher</button>
</div>
<div class="card">
<h3>Create Auction (You must have balance)</h3>
<input id="auction_title" placeholder="e.g. iPhone 13">
<input id="auction_desc" placeholder="Description">
<input id="auction_price" type="number" placeholder="Start Price e.g. 100">
<button onclick="createAuction()">Create Auction</button>
</div>
<div id="auctions" class="card"><h3>Auctions</h3>Loading...</div>
<script src="./app.js"></script>
</body>
</html>
