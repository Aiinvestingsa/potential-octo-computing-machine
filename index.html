<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>PHUZA - WhatsApp</title>
<style>
body{font-family:Arial;background:#0a0a0a;color:#fff;margin:0;padding:12px}
.card{background:#1e1e1e;padding:16px;border-radius:12px;margin:10px 0;border:1px solid #333}
button{background:#25D366;color:#000;padding:14px;border:0;border-radius:10px;font-weight:bold;width:100%;margin:6px 0;font-size:17px}
input{padding:14px;border-radius:10px;border:0;width:92%;margin:6px 0;font-size:16px;background:#2a2a2a;color:#fff}
h2{color:#25D366;text-align:center}
</style>
</head>
<body>
<h2>🔥 PHUZA AUCTION</h2>
<div id="status" class="card" style="background:#333">Ready - Enter WhatsApp ✅</div>

<div class="card">
<h3>📱 WhatsApp + PIN Login</h3>
<input id="wa_phone" placeholder="0761234567" type="tel">
<input id="wa_pin" placeholder="4-digit PIN e.g. 1234" type="tel" maxlength="6">
<input id="wa_name" placeholder="Your Name">
<input id="wa_ref" placeholder="Referral Code (optional)">
<button onclick="registerWA()" style="background:#25D366">✅ SIGN UP WITH WHATSAPP</button>
<button onclick="loginWA()" style="background:#128C7E;color:#fff">🔑 LOGIN WITH WHATSAPP</button>
<button onclick="logoutWA()" style="background:#555;color:#fff">Logout</button>
</div>

<div class="card">
<h3>Wallet: R<span id="balance">0</span> | Code: <b id="mycode">---</b></h3>
<div>Level <span id="mylevel">1</span> | Refs <span id="myrefs">0</span> | Phone: <span id="myphone">---</span></div>
</div>

<div class="card">
<h3>Auctions (Demo - No Supabase needed)</h3>
<input id="auction_title" placeholder="Item e.g. iPhone">
<input id="auction_price" type="number" placeholder="Price e.g. 100">
<button onclick="createAuctionLocal()">Create Auction</button>
<div id="auctions"></div>
</div>

<script>
// WHATSAPP LOCAL AUTH - WORKS WITHOUT INTERNET!
function getUsers(){ try{ return JSON.parse(localStorage.getItem('phuza_users')||'{}'); }catch{ return {}; } }
function saveUsers(u){ localStorage.setItem('phuza_users', JSON.stringify(u)); }
function setStatus(t){ document.getElementById('status').innerHTML = t; }

function registerWA(){
  const phone = document.getElementById('wa_phone').value.replace(/\D/g,'').slice(-10);
  const pin = document.getElementById('wa_pin').value.trim();
  const name = document.getElementById('wa_name').value.trim() || 'User';
  const refBy = document.getElementById('wa_ref').value.trim();
  
  if(phone.length < 10){ alert('Enter valid WhatsApp number e.g. 0761234567'); return; }
  if(pin.length < 4){ alert('PIN must be 4 digits'); return; }
  
  const users = getUsers();
  if(users[phone]){ alert('This number already registered! Click LOGIN'); return; }
  
  const refCode = 'PHUZA-' + phone.slice(-4) + Math.floor(Math.random()*90+10);
  users[phone] = { phone, pin, name, refCode, refBy, balance: 0, refCount: 0, level: 1, created: Date.now() };
  saveUsers(users);
  
  // Pay referrer if exists
  if(refBy){
    for(let p in users){ if(users[p].refCode === refBy){ users[p].refCount = (users[p].refCount||0)+1; users[p].balance = (users[p].balance||0)+5; saveUsers(users); break; } }
  }
  
  localStorage.setItem('phuza_current', phone);
  setStatus('✅ Registered! '+phone+' Code: '+refCode);
  document.getElementById('mycode').innerText = refCode;
  document.getElementById('myphone').innerText = phone;
  document.getElementById('balance').innerText = '0';
  alert('✅ Registered!\nPhone: '+phone+'\nPIN: '+pin+'\nYour Code: '+refCode+'\n\nLOGIN NEXT TIME WITH SAME NUMBER + PIN!');
  loadLocal();
}

function loginWA(){
  const phone = document.getElementById('wa_phone').value.replace(/\D/g,'').slice(-10);
  const pin = document.getElementById('wa_pin').value.trim();
  const users = getUsers();
  
  if(!users[phone]){ alert('Not registered! Click SIGN UP first'); return; }
  if(users[phone].pin !== pin){ alert('Wrong PIN!'); return; }
  
  localStorage.setItem('phuza_current', phone);
  const u = users[phone];
  setStatus('✅ Logged in: '+phone+' ('+u.name+') Code: '+u.refCode);
  document.getElementById('mycode').innerText = u.refCode;
  document.getElementById('myphone').innerText = u.phone;
  document.getElementById('balance').innerText = u.balance||0;
  document.getElementById('mylevel').innerText = u.level||1;
  document.getElementById('myrefs').innerText = u.refCount||0;
  alert('Welcome back '+u.name+'! Balance R'+(u.balance||0));
  loadLocal();
}

function logoutWA(){ localStorage.removeItem('phuza_current'); setStatus('Logged out - Ready'); location.reload(); }

function loadLocal(){
  const cur = localStorage.getItem('phuza_current');
  const users = getUsers();
  if(cur && users[cur]){
    const u = users[cur];
    document.getElementById('mycode').innerText = u.refCode;
    document.getElementById('myphone').innerText = u.phone;
    document.getElementById('balance').innerText = u.balance||0;
    document.getElementById('mylevel').innerText = u.level||1;
    document.getElementById('myrefs').innerText = u.refCount||0;
    setStatus('✅ '+u.phone+' ('+u.name+') Code: '+u.refCode+' Balance R'+u.balance);
  }
  // Load auctions
  const auctions = JSON.parse(localStorage.getItem('phuza_auctions')||'[]');
  const div = document.getElementById('auctions');
  if(auctions.length==0) div.innerHTML='<p>No auctions yet</p>';
  else div.innerHTML = auctions.map(a=>`<div style="border:1px solid #444;padding:8px;margin:5px;border-radius:8px"><b>${a.title}</b> - R${a.price}<br>by ${a.owner}<br><button onclick="bidLocal('${a.id}')">Bid R${a.price+10}</button></div>`).join('');
}

function createAuctionLocal(){
  const cur = localStorage.getItem('phuza_current');
  if(!cur){ alert('Login with WhatsApp first'); return; }
  const title = document.getElementById('auction_title').value.trim();
  const price = parseInt(document.getElementById('auction_price').value);
  if(!title || !price){ alert('Enter title + price'); return; }
  const auctions = JSON.parse(localStorage.getItem('phuza_auctions')||'[]');
  auctions.unshift({ id: Date.now()+'', title, price, owner: cur, created: Date.now() });
  localStorage.setItem('phuza_auctions', JSON.stringify(auctions));
  alert('Auction created!');
  loadLocal();
}

function bidLocal(id){
  const cur = localStorage.getItem('phuza_current');
  if(!cur){ alert('Login'); return; }
  const auctions = JSON.parse(localStorage.getItem('phuza_auctions')||'[]');
  const a = auctions.find(x=>x.id===id);
  if(a){ a.price += 10; localStorage.setItem('phuza_auctions', JSON.stringify(auctions)); alert('Bid R'+a.price); loadLocal(); }
}

// Auto load on start
loadLocal();
setStatus('Ready - WhatsApp Login Works 100% ✅ - No Internet Needed!');
</script>
</body>
</html>
